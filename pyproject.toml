[project]
name = "camp-tinker-swag"
version = "0.1.0"
description = "Raster logo → editable SVG pipeline with text preserved as <text> nodes."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "scikit-image>=0.24",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "cairosvg>=2.7",
    "lxml>=5.2",
    "fonttools>=4.55",
    "freetype-py>=2.5",
    "vtracer>=0.6.11",
    "pyfonts>=0.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
easyocr = ["easyocr>=1.7"]
doctr = ["python-doctr[torch]>=0.10"]
paddle = ["paddleocr>=2.10", "paddlepaddle>=2.6"]
tesseract = ["pytesseract>=0.3.13"]
lama = ["simple-lama-inpainting>=0.1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctswag"]
